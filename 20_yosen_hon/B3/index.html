<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            position: relative;
        }
        .box{
            width: 300px;
            height: 100px;
            background-color: #aaa;
            border: 1px solid #000;
            cursor: grab;
            position: absolute;
            top: 50px;
            left: 10px;
        }
        .box:active {
            cursor: grabbing;
            box-shadow: #666 5px 5px 5px;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <script src="script.js"></script>
</body>
</html>
